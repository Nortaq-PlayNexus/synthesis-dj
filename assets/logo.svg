<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0d1a30"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="95" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="2"/>

  <!-- hexagon frame -->
  <polygon points="256,70 406,160 406,352 256,442 106,352 106,160"
           fill="none" stroke="rgba(34,211,238,0.55)" stroke-width="6" stroke-linejoin="round"/>

  <!-- waveform bars -->
  <g stroke="url(#g)" stroke-width="12" stroke-linecap="round">
    <line x1="132" y1="320" x2="132" y2="210"/>
    <line x1="168" y1="320" x2="168" y2="150"/>
    <line x1="204" y1="320" x2="204" y2="240"/>
    <line x1="240" y1="320" x2="240" y2="180"/>
    <line x1="276" y1="320" x2="276" y2="260"/>
    <line x1="312" y1="320" x2="312" y2="140"/>
    <line x1="348" y1="320" x2="348" y2="230"/>
    <line x1="384" y1="320" x2="384" y2="200"/>
  </g>

  <!-- baseline -->
  <line x1="116" y1="330" x2="400" y2="330" stroke="rgba(148,163,184,0.6)" stroke-width="4" stroke-linecap="round"/>

  <!-- play marker -->
  <polygon points="400,352 424,366 400,380" fill="#fbbf24" opacity="0.9"/>

  <text x="256" y="430" text-anchor="middle"
        font-family="Consolas, monospace" font-size="22" font-weight="bold"
        fill="#c9d7ee" letter-spacing="6">SYNTHESIS</text>
</svg>
